name: Deploy aniface demo to GitHub Pages

# 触发：push 到 main 且改动涉及 demo，或手动在 Actions 页点 "Run workflow"
on:
  push:
    branches: [main]
    paths:
      - 'aniface-demo/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aniface-demo/package-lock.json

      - name: Install dependencies
        working-directory: aniface-demo
        run: npm ci

      # MediaPipe 运行时约 36MB，已在 .gitignore 中，构建时现生成：
      # WASM 从 node_modules 复制，两个模型从 Google 官方地址下载
      - name: Vendor MediaPipe runtime
        working-directory: aniface-demo
        run: npm run vendor:mediapipe

      # 防止"引用了已删除的元素 id"这类改动混进线上
      - name: UI id self-check
        working-directory: aniface-demo
        run: npm run check

      - name: Build
        working-directory: aniface-demo
        env:
          # GitHub Pages 的站点地址是 https://<user>.github.io/<repo>/
          # 仓库名自动取自当前仓库，无需手改
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # 注意：这里刻意不用 actions/configure-pages。
      # 它的作用是自动开启 Pages 并注入 base path —— 但自动开启需要仓库管理员权限，
      # 用内置 GITHUB_TOKEN 常常失败（本仓库实测就是卡在这一步）。
      # 本项目已经用 BASE_PATH 自己算好子路径，所以不需要它。
      # 前提：仓库 Settings → Pages → Source 必须是 "GitHub Actions"（一次性手动设置）。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: aniface-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
