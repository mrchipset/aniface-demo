name: Deploy aniface demo to GitHub Pages

# 触发：push 到 main 且改动涉及 demo，或手动在 Actions 页点 "Run workflow"
on:
  push:
    branches: [main]
    paths:
      - 'aniface-demo/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aniface-demo/package-lock.json

      - name: Install dependencies
        working-directory: aniface-demo
        run: npm ci

      # MediaPipe 运行时约 36MB，已在 .gitignore 中，构建时现生成：
      # WASM 从 node_modules 复制，两个模型从 Google 官方地址下载
      - name: Vendor MediaPipe runtime
        working-directory: aniface-demo
        run: npm run vendor:mediapipe

      # 防止"引用了已删除的元素 id"这类改动混进线上
      - name: UI id self-check
        working-directory: aniface-demo
        run: npm run check

      - name: Build
        working-directory: aniface-demo
        env:
          # GitHub Pages 的站点地址是 https://<user>.github.io/<repo>/
          # 仓库名自动取自当前仓库，无需手改
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # enablement: true —— 若仓库还没开 Pages，自动开启并把 Source 设为 GitHub Actions
      # （失败也不影响：手动去 Settings → Pages → Source 选 GitHub Actions 再重跑即可）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: aniface-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
